name: Test ARM64 overlay against upstream stable

on:
  push:
    branches: ['master']
    paths: ['.github/workflows/upstream-main-canary.yml']
  schedule:
    - cron: '47 7 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even when upstream stable source and ARM64 tooling have not changed'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-stable-arm64-canary
  cancel-in-progress: true

jobs:
  refresh-stable-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Refresh canary when upstream stable source or ARM64 tooling changes
        env:
          GH_TOKEN: ${{ github.token }}
          CANARY_PAT: ${{ secrets.CANARY_PAT }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ARM64 Canary Bot'
          git config user.email 'actions@users.noreply.github.com'

          latest_tag="$(gh api repos/nextcloud/desktop/releases/latest --jq '.tag_name')"
          if [[ ! "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "::error::Unexpected latest stable tag: $latest_tag"
            exit 1
          fi
          stable_branch="stable-${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          canary_branch="canary/${stable_branch}"

          git remote add upstream https://github.com/nextcloud/desktop.git 2>/dev/null || true
          git fetch upstream "+refs/heads/${stable_branch}:refs/remotes/upstream/${stable_branch}"
          git fetch origin '+refs/heads/arm64-tooling:refs/remotes/origin/arm64-tooling'
          git fetch origin "+refs/heads/${canary_branch}:refs/remotes/origin/${canary_branch}" 2>/dev/null || true

          upstream_sha="$(git rev-parse "upstream/${stable_branch}")"
          tooling_sha="$(git rev-parse origin/arm64-tooling)"
          upstream_marker=".github/upstream-stable-sha"
          tooling_marker=".github/arm64-tooling-sha"
          previous_upstream_sha="$(git show "origin/${canary_branch}:${upstream_marker}" 2>/dev/null || true)"
          previous_tooling_sha="$(git show "origin/${canary_branch}:${tooling_marker}" 2>/dev/null || true)"
          previous_upstream_sha="$(printf '%s' "$previous_upstream_sha" | tr -d '\r\n')"
          previous_tooling_sha="$(printf '%s' "$previous_tooling_sha" | tr -d '\r\n')"

          if [[ "$upstream_sha" == "$previous_upstream_sha" && "$tooling_sha" == "$previous_tooling_sha" && "${FORCE:-false}" != "true" ]]; then
            echo "No canary inputs changed: upstream=$upstream_sha tooling=$tooling_sha"
            exit 0
          fi

          git checkout -B "$canary_branch" "$upstream_sha"
          git checkout origin/arm64-tooling -- .github/scripts .github/workflows/arm64-release.yml
          # Don't sweep compiled Python cache into the canary commit.
          find .github/scripts -type d -name '__pycache__' -prune -exec rm -rf {} + 2>/dev/null || true
          mkdir -p .github
          printf '%s\n' "$upstream_sha" > "$upstream_marker"
          printf '%s\n' "$tooling_sha" > "$tooling_marker"

          git add .github
          git commit -m "ci: test ARM64 overlay against ${stable_branch} ${upstream_sha:0:12}"

          # GITHUB_TOKEN cannot create or update workflow files
          # ("refusing to allow a GitHub App to create or update workflow").
          # Push with a classic PAT carrying the `workflow` scope instead.
          if [[ -z "${CANARY_PAT:-}" ]]; then
            echo "::error::CANARY_PAT secret is not set. Create a classic PAT with the 'workflow' scope and add it as the CANARY_PAT repository secret."
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${CANARY_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${canary_branch}" --force

          # Stable canary uses the full ARM64 build but never publishes a release.
          gh workflow run arm64-release.yml --repo "$GITHUB_REPOSITORY" --ref "$canary_branch"
