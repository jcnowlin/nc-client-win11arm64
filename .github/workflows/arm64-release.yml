name: Build and Release Windows ARM64
on:
  push:
    branches:
      - 'arm64/v*'
      - 'canary/upstream-main'
      - 'canary/stable-*'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arm64-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-release:
    name: Build Nextcloud Desktop Windows ARM64
    runs-on: windows-11-arm
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    env:
      CRAFT_TARGET: windows-msvc2022_arm64-cl
      CRAFT_MASTER_LOCATION: ${{ github.workspace }}\CraftMaster
      CRAFT_MASTER_CONFIG: ${{ github.workspace }}\craftmaster-arm64.ini
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Run build-script regression tests
        run: |
          python -m unittest discover -s .github/scripts/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q .github/scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify version and prepare pinned ARM64 Craft
        id: version
        run: |
          $cmake = Get-Content 'VERSION.cmake' -Raw
          $parts = @('MAJOR', 'MINOR', 'PATCH') | ForEach-Object {
            $match = [regex]::Match($cmake, "MIRALL_VERSION_$_\s+(\d+)")
            if (-not $match.Success) { throw "Missing source version component: $_" }
            $match.Groups[1].Value
          }
          $sourceVersion = $parts -join '.'
          $isRelease = '${{ startsWith(github.ref, 'refs/heads/arm64/v') }}' -eq 'true'
          if ($isRelease) {
            $tag = (Get-Content '.github/arm64-release-version' -Raw).Trim()
            if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release marker: $tag" }
            $version = $tag.Substring(1)
            if ($sourceVersion -ne $version) { throw 'Source version and release marker disagree' }
            "publish=true" >> $env:GITHUB_OUTPUT
            "tag=$tag-arm64" >> $env:GITHUB_OUTPUT
          } else {
            $tag = 'upstream-main'
            $version = $sourceVersion
            "publish=false" >> $env:GITHUB_OUTPUT
            "tag=canary-$version" >> $env:GITHUB_OUTPUT
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          $config = Get-Content 'craftmaster.ini'
          $url = (($config | Where-Object { $_ -match '^CraftUrl\s*=' }) -split '=', 2)[1].Trim()
          $revision = (($config | Where-Object { $_ -match '^CraftRevision\s*=' }) -split '=', 2)[1].Trim()
          $kdeRef = (($config | Where-Object { $_ -match '^craft/craft-blueprints-kde\.revision\s*=' }) -split '=', 2)[1].Trim()
          $nextcloudRef = (($config | Where-Object { $_ -match '^craft/craft-blueprints-nextcloud\.revision\s*=' }) -split '=', 2)[1].Trim()
          if (-not $kdeRef -or -not $nextcloudRef) { throw 'Missing pinned blueprint revisions in craftmaster.ini' }
          "kde_ref=$kdeRef" >> $env:GITHUB_OUTPUT
          "nextcloud_ref=$nextcloudRef" >> $env:GITHUB_OUTPUT
          if ($revision -notmatch '^[0-9a-f]{40}$') { throw 'Expected an immutable upstream Craft revision' }
          $clone = Join-Path $env:GITHUB_WORKSPACE 'craft-clone'
          git clone $url $clone
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $clone checkout --detach $revision
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $relativePaths = @(
            'bin/CraftSetupHelper.py', 'blueprints/dev-utils/_windows/git/git.py',
            'blueprints/dev-utils/perl/perl.py', 'blueprints/libs/openssl/openssl.py',
            'blueprints/libs/liblzma/liblzma.py', 'blueprints/libs/libunistring/libunistring.py',
            'blueprints/libs/libffi/libffi.py', 'blueprints/libs/python/python.py'
          )
          $patchPaths = $relativePaths | ForEach-Object { Join-Path $clone $_ }
          python '.github/scripts/patch-craft-arm64.py' @patchPaths
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python '.github/scripts/patch_arm64_resources.py' $clone
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Commit NSIS changes before CraftMaster's forced revision checkouts.
          python '.github/scripts/patch-nsis-and-blueprint.py' $clone
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $clone config user.name 'ARM64 Build Bot'
          git -C $clone config user.email 'actions@users.noreply.github.com'
          git -C $clone add -A
          git -C $clone commit -m 'build: apply native Windows ARM64 compatibility layer'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $patchedRevision = (git -C $clone rev-parse HEAD).Trim()
          python '.github/scripts/arm64_config.py' 'craftmaster.ini' $env:CRAFT_MASTER_CONFIG $patchedRevision
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force 'release-output' | Out-Null
          @{
            source_commit = '${{ github.sha }}'; upstream_tag = $tag
            craft_url = $url; upstream_craft_revision = $revision
            patched_craft_revision = $patchedRevision; architecture = 'ARM64'
          } | ConvertTo-Json | Set-Content 'release-output/build-manifest.json' -Encoding utf8
      - name: Bootstrap Craft and build ARM64 dependencies
        run: |
          git clone --depth=1 'https://invent.kde.org/packaging/craftmaster.git' $env:CRAFT_MASTER_LOCATION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          function craft {
            $log = Join-Path $env:RUNNER_TEMP ("craft-" + [guid]::NewGuid().ToString() + '.log')
            Write-Host "Craft arguments: $args"
            & python "$env:CRAFT_MASTER_LOCATION/CraftMaster.py" --config $env:CRAFT_MASTER_CONFIG --target $env:CRAFT_TARGET -c @args *> $log
            $code = $LASTEXITCODE
            Get-Content $log -Tail 70
            if ($code -ne 0) { throw "Craft failed ($code). Full log: $log" }
          }
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-kde.git|${{ steps.version.outputs.kde_ref }}|"
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-nextcloud.git|${{ steps.version.outputs.nextcloud_ref }}|"
          craft craft
          $clone = Join-Path $env:GITHUB_WORKSPACE 'craft-clone'
          $locations = Join-Path $env:GITHUB_WORKSPACE "$env:CRAFT_TARGET/etc/blueprints/locations"
          $nextcloud = Join-Path $locations 'craft-blueprints-nextcloud'
          $kde = Join-Path $locations 'craft-blueprints-kde'
          python '.github/scripts/patch-nsis-and-blueprint.py' $clone "$nextcloud/nextcloud-client/nextcloud-client.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python '.github/scripts/patch-kde-blueprints-arm64.py' "$kde/libs/libjpeg-turbo/libjpeg-turbo.py" "$kde/libs/pixman/pixman.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Pin the patched external blueprints so later invocations retain them.
          foreach ($name in @('craft-blueprints-kde', 'craft-blueprints-nextcloud')) {
            $directory = Join-Path $locations $name
            git -C $directory config user.name 'ARM64 Build Bot'
            git -C $directory config user.email 'actions@users.noreply.github.com'
            git -C $directory add -A
            git -C $directory commit --allow-empty -m 'build: preserve Windows ARM64 packaging fixes'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $revision = (git -C $directory rev-parse HEAD).Trim()
            $text = [IO.File]::ReadAllText($env:CRAFT_MASTER_CONFIG)
            $pattern = "(?m)^craft/" + [regex]::Escape($name) + "\.revision\s*=\s*.*$"
            if (-not [regex]::IsMatch($text, $pattern)) { throw "Missing blueprint revision setting: $name" }
            $text = [regex]::Replace($text, $pattern, "craft/$name.revision = $revision", 1)
            [IO.File]::WriteAllText($env:CRAFT_MASTER_CONFIG, $text)
          }
          craft --install-deps nextcloud-client
      - name: Install Inkscape for icon generation
        continue-on-error: true
        run: choco install inkscape --no-progress -y
      - name: Compile client and run its tests
        run: |
          "$env:GITHUB_WORKSPACE/$env:CRAFT_TARGET/bin" >> $env:GITHUB_PATH
          $env:PATH = "$env:GITHUB_WORKSPACE/$env:CRAFT_TARGET/bin;$env:PATH"
          $log = Join-Path $env:RUNNER_TEMP 'craft-client.log'
          & python "$env:CRAFT_MASTER_LOCATION/CraftMaster.py" --config $env:CRAFT_MASTER_CONFIG --target $env:CRAFT_TARGET -c --src-dir $env:GITHUB_WORKSPACE nextcloud-client *> $log
          $code = $LASTEXITCODE
          Get-Content $log -Tail 70
          if ($code -ne 0) { throw "Client compilation failed: $code" }
          & ctest --test-dir "$env:GITHUB_WORKSPACE/$env:CRAFT_TARGET/build/nextcloud-client/work/build" --output-on-failure --no-tests=error --timeout 300
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate native binaries and package installer
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE $env:CRAFT_TARGET
          foreach ($name in @('nextcloud.exe', 'Qt6Core.dll')) {
            $file = Join-Path $root "bin/$name"
            $bytes = [IO.File]::ReadAllBytes($file)
            if ($bytes.Length -lt 256 -or [BitConverter]::ToUInt16($bytes, 0) -ne 0x5A4D) { throw "Invalid PE: $name" }
            $offset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($offset -lt 0 -or $offset + 6 -gt $bytes.Length -or [BitConverter]::ToUInt32($bytes, $offset) -ne 0x4550) { throw "Invalid PE header: $name" }
            if ([BitConverter]::ToUInt16($bytes, $offset + 4) -ne 0xAA64) { throw "Not ARM64: $name" }
            Write-Host "${name}: ARM64 (0xAA64)"
          }
          $version = '${{ steps.version.outputs.version }}'
          $fileVersion = (Get-Item "$root/bin/nextcloud.exe").VersionInfo.FileVersion
          if ($fileVersion -notmatch ('^' + [regex]::Escape($version) + '(\D|$)')) { throw "Unexpected binary version: $fileVersion" }
          $log = Join-Path $env:RUNNER_TEMP 'craft-package.log'
          & python "$env:CRAFT_MASTER_LOCATION/CraftMaster.py" --config $env:CRAFT_MASTER_CONFIG --target $env:CRAFT_TARGET -c --src-dir $env:GITHUB_WORKSPACE --package nextcloud-client *> $log
          $code = $LASTEXITCODE
          Get-Content $log -Tail 70
          if ($code -ne 0) { throw "Installer packaging failed: $code" }
          $installer = Get-ChildItem $root -Recurse -Filter '*.exe' -File |
            Where-Object { $_.Name -match '(?i)nextcloud.*(setup|installer|arm64)' } |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw 'No NSIS installer was produced' }
          $name = "Nextcloud-$version-Windows-ARM64-setup.exe"
          Copy-Item $installer.FullName "release-output/$name"
          $hash = (Get-FileHash "release-output/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content 'release-output/SHA256SUMS.txt' -Encoding ascii
      - name: Upload validated installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextcloud-windows-arm64-${{ steps.version.outputs.version }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish release only after successful build and tests
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Nextcloud Desktop ${{ steps.version.outputs.version }} for Windows ARM64
          draft: false
          prerelease: false
          make_latest: true
          files: release-output/*
          body: |
            Unofficial native Windows ARM64 build of Nextcloud Desktop ${{ steps.version.outputs.version }}.
            Includes the installer, SHA-256 checksum and source/toolchain manifest.

            Automated checks: build-script regression tests, client CTest suite, and ARM64 PE checks for nextcloud.exe and Qt6Core.dll.
            These checks do not establish that installation, Explorer integration, VFS, or sync behavior has been tested on a physical device.
            Intended for Windows 11 ARM64. Unsigned community build; not an official Nextcloud GmbH distribution.
      - name: Preserve bounded troubleshooting logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arm64-build-failure-logs
          path: ${{ runner.temp }}/craft-*.log
          if-no-files-found: ignore
          retention-days: 7
